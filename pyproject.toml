[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pscad-mcp"
version = "0.1.0"
description = "A dual-backend MCP server for PSCAD 4.6.x and 5.x automation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LL0pez20", email = "luansantos@poli.ufrj.br"}
]
dependencies = [
    "mcp>=1.29,<2",
    "psutil"
]

[project.optional-dependencies]
windows = [
    "mhi-pscad>=3.1,<4",
    "mhi-psout>=1.3,<2"
]

[project.scripts]
pscad-mcp = "pscad_mcp.main:main"

[tool.setuptools.packages.find]
include = ["pscad_mcp*"]
