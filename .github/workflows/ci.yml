name: Windows CI

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run contract suite
        run: python -m pytest -q
      - name: Compile package and tests
        run: python -m compileall -q pscad_mcp tests
      - name: Verify dependencies
        run: python -m pip check
      - name: Verify exact MCP tool inventory
        # Expected output: 70 70
        run: >-
          python -c "from pscad_mcp.main import create_server; tools=create_server()._tool_manager.list_tools(); print(len(tools), len({tool.name for tool in tools})); assert len(tools) == len({tool.name for tool in tools}) == 70"
